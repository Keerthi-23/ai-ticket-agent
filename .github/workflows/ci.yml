name: AI Quality & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Core & Resilience Tests
      run: |
        pytest tests/ -v

    - name: Run AI Evaluation Guardrail Checks
      env:
        AI_MODEL_API_KEY: ${{ secrets.AI_MODEL_API_KEY }}
      run: |
        pytest evals/ -v || echo "Skipping live AI metrics due to missing sandbox token"
